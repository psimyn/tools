<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1013" />
<title>Call</title>
<script src="public/qrcode.js"></script>
<style>
  :root {
    --bg: #0e1013;
    --panel: #171a20;
    --panel2: #1f232b;
    --ink: #eef1f6;
    --muted: #8b93a3;
    --line: rgba(255, 255, 255, 0.09);
    --go: #2fbf71;
    --stop: #ef4b4b;
    --accent: #6ea8ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100%;
    overflow: hidden;
  }
  body { -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; -webkit-user-select: none; user-select: none; }
  [hidden] { display: none !important; }

  /* ---------- pre-call screens ---------- */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px);
    text-align: center;
    overflow-y: auto;
  }
  h1 {
    margin: 0; font-size: 14px; font-weight: 600;
    letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted);
  }
  .big { font-size: 24px; font-weight: 600; margin: 0; }
  .sub { color: var(--muted); font-size: 15px; margin: 0; max-width: 360px; line-height: 1.45; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-width: 150px; padding: 14px 20px;
    border-radius: 999px;
    background: var(--panel2);
    border: 1px solid var(--line);
    font-size: 16px; font-weight: 600;
    transition: transform 80ms ease, background 120ms ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--go); border-color: transparent; color: #04140b; }
  .btn.ghost { background: transparent; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .err { color: #ff8a8a; font-size: 14px; max-width: 360px; line-height: 1.4; }

  .preview {
    width: min(320px, 80vw); aspect-ratio: 3 / 4;
    border-radius: 18px; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line);
    position: relative;
  }
  .preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .preview.landscape { aspect-ratio: 4 / 3; }

  .share {
    width: 100%; max-width: 380px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: stretch;
  }
  .link {
    font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; word-break: break-all; text-align: left; color: var(--ink);
    -webkit-user-select: all; user-select: all;
  }
  .qr { width: 168px; height: 168px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 6px; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .share .row .btn { min-width: 0; flex: 1; padding: 12px 14px; font-size: 15px; }

  .pulse { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; }
  .pulse::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--go);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }

  /* ---------- in-call stage ---------- */
  #stage { position: fixed; inset: 0; background: #000; }
  #remoteVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #stage.contain #remoteVideo { object-fit: contain; }
  .avatar {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 40%, #1d222b 0%, var(--bg) 70%);
  }
  .avatar .ring {
    width: 128px; height: 128px; border-radius: 50%;
    background: var(--panel2); border: 1px solid var(--line);
    display: grid; place-items: center;
    box-shadow: 0 0 0 calc(var(--lvl, 0) * 26px) rgba(47, 191, 113, 0.22);
    transition: box-shadow 90ms linear;
  }
  .avatar .ring svg { width: 56px; height: 56px; color: var(--muted); }
  .avatar .label { color: var(--muted); font-size: 15px; }

  #localWrap {
    position: absolute; width: 112px; aspect-ratio: 3 / 4;
    right: 14px; top: calc(env(safe-area-inset-top) + 14px);
    border-radius: 14px; overflow: hidden;
    background: #111; border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    touch-action: none; z-index: 3;
  }
  #localVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #localWrap.rear #localVideo { transform: none; }
  #localWrap .off { position: absolute; inset: 0; display: grid; place-items: center; background: #15181d; color: var(--muted); }
  #localWrap .off svg { width: 28px; height: 28px; }
  @media (min-width: 700px) { #localWrap { width: 180px; } }

  .topbar {
    position: absolute; left: 0; right: 0; top: 0; z-index: 2;
    padding: calc(env(safe-area-inset-top) + 14px) 16px 28px;
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(rgba(0,0,0,0.55), transparent);
    font-size: 14px; color: #dfe4ec;
    transition: opacity 200ms ease;
  }
  .topbar .timer { font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.45); border-radius: 999px; padding: 4px 10px; font-size: 13px;
  }
  .badge svg { width: 14px; height: 14px; }
  .badge.warn { color: #ffd479; }

  .controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 30px 16px calc(env(safe-area-inset-bottom) + 22px);
    display: flex; justify-content: center; gap: 16px;
    background: linear-gradient(transparent, rgba(0,0,0,0.6));
    transition: opacity 200ms ease;
  }
  .cbtn {
    width: 58px; height: 58px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255,255,255,0.16);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform 80ms ease, background 120ms ease;
  }
  .cbtn:active { transform: scale(0.93); }
  .cbtn svg { width: 26px; height: 26px; }
  .cbtn.off { background: #f2f4f7; color: #111; }
  .cbtn.hang { background: var(--stop); }
  .cbtn.hang svg { transform: rotate(135deg); }
  #stage.idle .controls, #stage.idle .topbar { opacity: 0; pointer-events: none; }
  .topbar .timer { cursor: pointer; }
  #info {
    position: absolute; z-index: 4; left: 12px; right: 12px;
    top: calc(env(safe-area-inset-top) + 52px); max-width: 360px;
    background: rgba(14,16,19,0.88); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cfd6e2; white-space: pre-wrap; pointer-events: none;
  }
  .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; margin-left: auto; }
  .bars i { width: 4px; border-radius: 1px; background: rgba(255,255,255,0.3); }
  .bars i:nth-child(1) { height: 5px; } .bars i:nth-child(2) { height: 9px; } .bars i:nth-child(3) { height: 14px; }
  .bars[data-q="3"] i { background: var(--go); }
  .bars[data-q="2"] i:nth-child(-n+2) { background: #ffd479; }
  .bars[data-q="1"] i:nth-child(1) { background: var(--stop); }
  #playBtn { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%); }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 110px);
    transform: translateX(-50%);
    background: rgba(30,34,42,0.95); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 10;
    pointer-events: none; transition: opacity 200ms ease; opacity: 0;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- SVG icons -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></symbol>
    <symbol id="i-video-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16v1a1 1 0 0 1-1 1H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2m4 0h5a1 1 0 0 1 1 1v3.3l6-3.3v10"/><path d="M2 2l20 20"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></symbol>
    <symbol id="i-mic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 9.3V5a3 3 0 0 0-5.7-1.3M9 9v3a3 3 0 0 0 5.1 2.1"/><path d="M19 10a7 7 0 0 1-1.2 3.9M5 10a7 7 0 0 0 11.4 5.4M12 17v5M2 2l20 20"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-3H9L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M9 13.5a3 3 0 0 1 5.2-2M15 12.5a3 3 0 0 1-5.2 2M14.5 9.5v2h-2M9.5 16.5v-2h2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  </defs>
</svg>

<!-- Start: no link yet -->
<section class="screen" id="startScreen" hidden>
  <h1>Call</h1>
  <p class="big">Start a call</p>
  <p class="sub">You'll get a link to send. When they open it, you're connected — directly, browser to browser.</p>
  <div class="row">
    <button class="btn primary" data-start="video"><svg><use href="#i-video"/></svg>Video call</button>
    <button class="btn" data-start="audio"><svg><use href="#i-phone"/></svg>Voice call</button>
  </div>
  <div class="err" id="startErr" hidden></div>
</section>

<!-- Join: opened a link -->
<section class="screen" id="joinScreen" hidden>
  <h1>Call</h1>
  <p class="big" id="joinTitle">Join call</p>
  <p class="sub" id="joinSub">Your browser will ask for camera / microphone access.</p>
  <div class="row">
    <button class="btn primary" data-join="video"><svg><use href="#i-video"/></svg>Join with video</button>
    <button class="btn" data-join="audio"><svg><use href="#i-phone"/></svg>Voice only</button>
  </div>
  <button class="btn ghost" id="newCallBtn" style="min-width:0;font-weight:500;color:var(--muted)">Start a different call</button>
  <div class="err" id="joinErr" hidden></div>
</section>

<!-- Connecting / waiting -->
<section class="screen" id="waitScreen" hidden>
  <div class="preview" id="preview" hidden><video id="previewVideo" autoplay playsinline muted></video></div>
  <div class="pulse" id="waitStatus">Connecting…</div>
  <div class="share" id="shareBox" hidden>
    <div class="link" id="linkText"></div>
    <div class="row">
      <button class="btn primary" id="shareBtn"><svg><use href="#i-share"/></svg>Share</button>
      <button class="btn" id="copyBtn"><svg><use href="#i-copy"/></svg>Copy</button>
    </div>
    <div class="qr" id="qr" hidden></div>
  </div>
  <button class="btn ghost" id="cancelBtn" style="color:var(--muted)">Cancel</button>
</section>

<!-- Ended -->
<section class="screen" id="endScreen" hidden>
  <h1>Call</h1>
  <p class="big" id="endTitle">Call ended</p>
  <p class="sub" id="endSub"></p>
  <div class="row">
    <button class="btn primary" id="rejoinBtn">Rejoin</button>
    <button class="btn" id="endNewBtn">New call</button>
  </div>
</section>

<!-- In call -->
<section id="stage" hidden>
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="avatar" id="avatar" hidden>
    <div class="ring" id="ring"><svg><use href="#i-user"/></svg></div>
    <div class="label" id="avatarLabel">Voice call</div>
  </div>
  <div id="localWrap">
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="off" id="localOff" hidden><svg><use href="#i-video-off"/></svg></div>
  </div>
  <div class="topbar">
    <span class="timer" id="timer" title="Connection info">0:00</span>
    <span class="badge" id="remoteMuted" hidden><svg><use href="#i-mic-off"/></svg>Muted</span>
    <span class="badge warn" id="netBadge" hidden>Reconnecting…</span>
    <span class="bars" id="bars" hidden data-q="3"><i></i><i></i><i></i></span>
  </div>
  <div id="info" hidden></div>
  <button class="btn primary" id="playBtn" hidden>Tap to start audio &amp; video</button>
  <div class="controls">
    <button class="cbtn" id="micBtn" aria-label="Mute"><svg><use href="#i-mic"/></svg></button>
    <button class="cbtn" id="camBtn" aria-label="Camera off"><svg><use href="#i-video"/></svg></button>
    <button class="cbtn" id="flipBtn" aria-label="Switch camera" hidden><svg><use href="#i-flip"/></svg></button>
    <button class="cbtn hang" id="hangBtn" aria-label="Hang up"><svg><use href="#i-phone"/></svg></button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);

  // ---------- config ----------
  // Where the signalling Worker (call-worker/ in this repo) lives. "" means
  // this page's own origin, which is the case when the Worker serves the page.
  // If no Worker answers there, the app falls back to the free public PeerJS
  // server, used purely as a message relay.
  const WORKER_URL = "";
  const PEERJS = { host: "0.peerjs.com", key: "peerjs", prefix: "psimyn-call-" };
  const CODE_ALPHABET = "abcdefghjkmnpqrstuvwxyz23456789";
  // Used with the PeerJS fallback: Google + Cloudflare STUN, and PeerJS's
  // public TURN relay for networks where a direct path is impossible.
  const FALLBACK_ICE = [
    { urls: ["stun:stun.l.google.com:19302", "stun:stun.cloudflare.com:3478"] },
    { urls: ["turn:eu-0.turn.peerjs.com:3478", "turn:us-0.turn.peerjs.com:3478"], username: "peerjs", credential: "peerjsp" },
  ];
  const AUDIO = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
  const videoConstraints = (facing) => ({
    facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30, max: 30 },
  });

  const screens = ["startScreen", "joinScreen", "waitScreen", "endScreen", "stage"];
  function show(id) { for (const s of screens) $(s).hidden = s !== id; }

  let toastTimer;
  function toast(msg) {
    if (!msg) return;
    const t = $("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  const rand = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => CODE_ALPHABET[b % CODE_ALPHABET.length]).join("");
  const store = {
    get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
  };
  // Stable per tab (survives reloads), so a reload rejoins as the same person.
  const CID = store.get("call-cid") || (() => { const c = rand(16); store.set("call-cid", c); return c; })();

  // ---------- state ----------
  const S = {
    code: null, mode: "video", localStream: null,
    backend: null,          // { kind: "worker"|"peerjs", base, iceServers, turn, at }
    sig: null,              // signalling transport
    peer: null,             // the other person's client id
    pc: null, dc: null,
    sid: null, remoteSid: null, polite: false,
    makingOffer: false, ignoreOffer: false, answerPending: false, chain: Promise.resolve(),
    remoteStream: null, everUp: false, inStage: false,
    restarts: 0, restartTimer: 0, giveUpTimer: 0, leftTimer: 0, offerWait: 0, peerAway: false,
    micOn: true, camOn: true, facing: "user",
    startedAt: 0, timerId: 0, statsTimer: 0, wakeLock: null,
    audioCtx: null, meterRaf: 0, meterSrc: null,
  };
  let remoteCamOn = true;
  // ?debug exposes the call state in the console (and to the tests).
  if (/[?&]debug\b/.test(location.search)) window.__call = S;

  function codeFromHash() {
    const h = location.hash.replace(/^#/, "").trim().toLowerCase();
    return /^[a-z0-9]{6,32}$/.test(h) ? h : null;
  }
  function linkFor(code) { return location.href.split("#")[0] + "#" + code; }
  function hasVideo(stream) { return !!stream && stream.getVideoTracks().some((t) => t.readyState === "live"); }

  // ---------- backend discovery ----------
  // Started at page load so it's usually done before anyone taps a button.
  let probe = null;
  function discover() {
    if (!probe) probe = (async () => {
      const base = WORKER_URL || location.href;
      for (let i = 0; i < (WORKER_URL ? 3 : 1); i++) {
        try {
          const ctl = new AbortController();
          const t = setTimeout(() => ctl.abort(), 5000);
          const r = await fetch(new URL("api/ice", base), { signal: ctl.signal, cache: "no-store" });
          clearTimeout(t);
          if (r.ok) {
            const j = await r.json();
            if (Array.isArray(j.iceServers)) return { kind: "worker", base, iceServers: j.iceServers, turn: !!j.turn, at: Date.now() };
          }
        } catch {}
      }
      // A configured Worker that doesn't answer must not silently fall back:
      // the other person would be on the Worker and we'd never meet.
      if (WORKER_URL) { probe = null; throw new Error("Can't reach the call server. Check your connection and try again."); }
      return { kind: "peerjs", iceServers: FALLBACK_ICE, turn: true, at: Date.now() };
    })();
    return probe;
  }
  async function backend() {
    let b = await discover();
    if (b.kind === "worker" && Date.now() - b.at > 30 * 60e3) {
      // TURN credentials are short-lived; refresh if the page sat open a while.
      probe = null;
      try { b = await discover(); } catch {}
    }
    return b;
  }

  // ---------- signalling: Cloudflare Worker room ----------
  function workerSignal(base, code, h) {
    let ws = null, closed = false, attempt = 0, pingT = 0, retryT = 0, pongT = 0;
    const queue = [];
    const url = new URL("api/room/" + code, base);
    url.protocol = url.protocol === "http:" ? "ws:" : "wss:";
    url.searchParams.set("cid", CID);
    function open() {
      if (closed) return;
      clearTimeout(retryT); clearTimeout(pongT); clearInterval(pingT);
      if (ws) { const old = ws; ws = null; try { old.close(); } catch {} }
      const me = (ws = new WebSocket(url));
      me.onopen = () => {
        attempt = 0;
        pingT = setInterval(() => alive(10000), 15000);
        while (queue.length && me.readyState === 1) me.send(queue.shift());
      };
      me.onmessage = (e) => {
        if (ws !== me) return;
        if (e.data === "pong") { clearTimeout(pongT); return; }
        let m; try { m = JSON.parse(e.data); } catch { return; }
        if (m.t === "welcome") h.ready(m.peers || []);
        else if (m.t === "peer-joined") h.peer(m.peer);
        else if (m.t === "peer-left") h.left(m.peer);
        else if (m.t === "signal") h.message(m.from, m.data);
        else if (m.t === "full") { closed = true; h.full(); }
      };
      me.onclose = (e) => {
        if (ws !== me) return;
        clearInterval(pingT); clearTimeout(pongT);
        if (closed || e.code === 4002) return;
        if (e.code === 4001) { closed = true; h.replaced(); return; }
        retryT = setTimeout(open, Math.min(8000, 400 * 2 ** attempt++));
      };
    }
    // A socket can look open long after the network under it changed (phones
    // switching Wi-Fi <-> mobile). The room answers "ping" with "pong" without
    // waking up, so no pong in time means the socket is dead: replace it.
    function alive(timeout) {
      if (closed || !ws) return;
      if (ws.readyState !== 1) { if (ws.readyState > 1) open(); return; }
      clearTimeout(pongT);
      try { ws.send("ping"); } catch {}
      pongT = setTimeout(() => { if (!closed) { attempt = 0; open(); } }, timeout);
    }
    open();
    return {
      kind: "worker",
      send(data) {
        const s = JSON.stringify({ t: "signal", data });
        if (ws && ws.readyState === 1) ws.send(s);
        else { queue.push(s); if (queue.length > 300) queue.shift(); }
      },
      reconnectNow() {
        if (closed) return;
        if (ws && ws.readyState <= 1) { alive(3000); return; }
        attempt = 0; open();
      },
      peerGone() {},
      close() {
        closed = true; clearTimeout(retryT); clearInterval(pingT); clearTimeout(pongT);
        try { ws && ws.close(1000); } catch {}
      },
    };
  }

  // ---------- signalling: public PeerJS server as a relay (fallback) ----------
  // Talks the PeerJS server's WebSocket protocol directly; no PeerJS library.
  // Whoever registers the room id first "holds" the room. Everyone else
  // registers their own id and says hello to the holder. The holder's token
  // is kept per tab, so a reload or reconnect reclaims the room instead of
  // getting "ID is taken".
  function peerjsSignal(code, h) {
    const roomId = PEERJS.prefix + code;
    const token = store.get("call-token-" + code) || (() => { const t = rand(16); store.set("call-token-" + code, t); return t; })();
    let ws = null, closed = false, role = null, peerId = null, attempt = 0;
    let hb = 0, retryT = 0, helloT = 0;
    const queue = [];

    function connect(asHolder) {
      clearTimeout(retryT); clearTimeout(helloT); clearInterval(hb);
      if (ws) { const old = ws; ws = null; try { old.close(); } catch {} }
      if (closed) return;
      role = null;
      const id = asHolder ? roomId : roomId + "-" + CID;
      const me = (ws = new WebSocket(`wss://${PEERJS.host}/peerjs?key=${PEERJS.key}&id=${encodeURIComponent(id)}&token=${token}&version=1.5.4`));
      // If our previous socket for this id is still registered (same token),
      // the server silently re-attaches us and sends no OPEN. Silence after
      // connecting therefore means success.
      let openT = 0, opened = false;
      const onOpen = () => {
        if (opened || ws !== me) return;
        opened = true; clearTimeout(openT);
        attempt = 0;
        role = asHolder ? "holder" : "guest";
        hb = setInterval(() => me.readyState === 1 && me.send('{"type":"HEARTBEAT"}'), 5000);
        if (role === "holder") { if (!peerId) h.ready([]); flush(); }
        else hello();
      };
      me.onopen = () => { openT = setTimeout(onOpen, 1500); };
      me.onmessage = (e) => {
        if (ws !== me) return;
        let m; try { m = JSON.parse(e.data); } catch { return; }
        switch (m.type) {
          case "OPEN":
            onOpen();
            break;
          case "ID-TAKEN":
            clearTimeout(openT);
            if (asHolder) connect(false);
            else { closed = true; h.replaced(); }
            break;
          case "ERROR":
            clearTimeout(openT);
            console.warn("signalling error", m.payload);
            break;
          case "EXPIRE": // our message to the holder couldn't be delivered
          case "LEAVE":
            if (role === "guest" && m.src === roomId) holderGone();
            else if (m.src === peerId && m.type === "LEAVE") h.left(peerCid);
            break;
          case "OFFER":
            onPayload(m.src, m.payload);
            break;
        }
      };
      me.onclose = () => {
        if (ws !== me) return;
        clearInterval(hb); clearTimeout(openT);
        if (closed) return;
        retryT = setTimeout(() => connect(role !== "guest"), Math.min(8000, 400 * 2 ** attempt++));
      };
    }
    let peerCid = null;
    function raw(dst, p) {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "OFFER", dst, payload: { ...p, cid: CID } }));
    }
    function hello() {
      raw(roomId, { k: "hello" });
      clearTimeout(helloT);
      helloT = setTimeout(holderGone, 8000);
    }
    // Guest: the holder isn't answering (left, or a stale registration the
    // server hasn't dropped yet), so try to hold the room ourselves.
    function holderGone() {
      clearTimeout(helloT);
      if (closed) return;
      peerId = null;
      retryT = setTimeout(() => connect(true), 400 + Math.random() * 800);
    }
    function flush() {
      while (queue.length && peerId && ws && ws.readyState === 1) raw(peerId, { k: "sig", data: queue.shift() });
    }
    function onPayload(src, p) {
      if (!p || typeof p !== "object" || !p.cid) return;
      if (p.k === "hello") {
        if (role !== "holder") return;
        if (peerId && peerId !== src && !h.canAccept(p.cid)) { raw(src, { k: "full" }); return; }
        peerId = src; peerCid = p.cid;
        raw(src, { k: "welcome" });
        h.peer(p.cid);
        flush();
      } else if (p.k === "welcome") {
        if (role !== "guest" || src !== roomId) return;
        clearTimeout(helloT);
        peerId = src; peerCid = p.cid;
        h.ready([p.cid]);
        flush();
      } else if (p.k === "full") {
        closed = true; h.full();
      } else if (p.k === "sig" && src === peerId) {
        h.message(p.cid, p.data);
      }
    }
    connect(true);
    return {
      kind: "peerjs",
      send(data) {
        if (peerId && ws && ws.readyState === 1) raw(peerId, { k: "sig", data });
        else { queue.push(data); if (queue.length > 300) queue.shift(); }
      },
      reconnectNow() {
        if (closed || (ws && ws.readyState <= 1)) return;
        attempt = 0; connect(role !== "guest"); // also replaces a socket stuck in CLOSING
      },
      // The other person left for good: a guest takes over the room so the
      // link keeps working; a holder just waits for the next hello.
      peerGone() {
        peerId = null; peerCid = null; queue.length = 0;
        if (role === "guest") holderGone();
      },
      close() {
        closed = true; clearTimeout(retryT); clearTimeout(helloT); clearInterval(hb);
        try { ws && ws.close(); } catch {}
      },
    };
  }

  // ---------- media ----------
  async function getMedia(mode) {
    // Safari: tell the OS this is a call, so audio routes and ducks like one.
    try { if (navigator.audioSession) navigator.audioSession.type = "play-and-record"; } catch {}
    if (mode === "audio") return navigator.mediaDevices.getUserMedia({ audio: AUDIO, video: false });
    try {
      return await navigator.mediaDevices.getUserMedia({ audio: AUDIO, video: videoConstraints(S.facing) });
    } catch (e) {
      if (e.name === "NotFoundError" || e.name === "OverconstrainedError" || e.name === "NotReadableError") {
        S.mode = "audio";
        toast("No camera available — joining with voice");
        return navigator.mediaDevices.getUserMedia({ audio: AUDIO, video: false });
      }
      throw e;
    }
  }

  function mediaErrorText(e) {
    if (!navigator.mediaDevices) return "This page needs HTTPS (or localhost) to use the camera and microphone.";
    if (e.name === "NotAllowedError") return "Camera / microphone permission was blocked. Allow it in your browser's site settings and try again.";
    if (e.name === "NotFoundError") return "No microphone found.";
    return "Couldn't access your camera / microphone: " + (e.message || e.name);
  }

  // iOS ends capture tracks when the page is backgrounded, and unplugging a
  // headset ends the mic track. Get a fresh one and swap it into the call
  // without renegotiating.
  function watchTrack(t) {
    t.addEventListener("ended", () => {
      if (S.localStream && S.localStream.getTracks().includes(t)) setTimeout(() => reacquire(t.kind), 400);
    });
  }
  async function reacquire(kind, wantFacing) {
    if (!S.localStream) return false;
    const old = S.localStream.getTracks().find((x) => x.kind === kind);
    if (old) old.stop(); // many phones can't open two cameras at once
    const get = async (c) => (await navigator.mediaDevices.getUserMedia(c)).getTracks()[0];
    let fresh, switched = false;
    try {
      if (kind === "audio") fresh = await get({ audio: AUDIO });
      else if (wantFacing) {
        try { fresh = await get({ video: videoConstraints({ exact: wantFacing }) }); switched = true; }
        catch { fresh = await get({ video: videoConstraints(S.facing) }); }
      } else fresh = await get({ video: videoConstraints(S.facing) });
    } catch { return false; }
    if (!S.localStream) { fresh.stop(); return false; }
    if (switched) S.facing = wantFacing;
    fresh.enabled = kind === "audio" ? S.micOn : S.camOn;
    if (old) S.localStream.removeTrack(old);
    S.localStream.addTrack(fresh);
    watchTrack(fresh);
    const sender = S.pc && S.pc.getSenders().find((x) => x.track && x.track.kind === kind);
    if (sender) await sender.replaceTrack(fresh).catch(() => {});
    $("localVideo").srcObject = S.localStream;
    if (!$("waitScreen").hidden) $("previewVideo").srcObject = S.localStream;
    $("localWrap").classList.toggle("rear", S.facing === "environment");
    return wantFacing ? switched : true;
  }

  // ---------- flow ----------
  async function begin(mode, code) {
    S.mode = mode; S.code = code;
    S.micOn = true; S.camOn = true;
    const errEl = codeFromHash() ? $("joinErr") : $("startErr");
    errEl.hidden = true;
    if (!window.RTCPeerConnection) { errEl.textContent = "This browser doesn't support WebRTC calls."; errEl.hidden = false; return; }

    // Media permission and backend discovery in parallel.
    const be = backend().catch((e) => e);
    try {
      S.localStream = await getMedia(mode);
    } catch (e) {
      errEl.textContent = mediaErrorText(e); errEl.hidden = false; return;
    }
    S.localStream.getTracks().forEach(watchTrack);
    if (location.hash !== "#" + code) history.replaceState(null, "", "#" + code);

    $("preview").hidden = !hasVideo(S.localStream);
    $("previewVideo").srcObject = S.localStream;
    $("shareBox").hidden = true;
    setWait("Connecting…");
    show("waitScreen");
    requestWakeLock();

    const b = await be;
    if (b instanceof Error) { endCall(b.message, true); return; }
    if (!S.localStream) return; // cancelled meanwhile
    S.backend = b;
    // Events from a transport we've since retired (e.g. the previous call's
    // socket, still closing when Rejoin is tapped) must not touch this call.
    let sig = null;
    const live = (fn) => (...args) => { if (S.sig === sig) fn(...args); };
    const handlers = {
      // The newcomer makes the first offer; whoever was already waiting answers.
      ready: live((peers) => (peers.length ? peerPresent(peers[0], true) : alone())),
      peer: live((cid) => peerPresent(cid, false)),
      left: live(peerLeftSignalling),
      message: live(onSignal),
      full: live(() => endCall("This call already has two people in it.", false, true)),
      replaced: live(() => endCall("This call was opened in another tab.", false)),
      canAccept: (cid) => !S.pc || cid === S.peer,
    };
    sig = S.sig = b.kind === "worker" ? workerSignal(b.base, code, handlers) : peerjsSignal(code, handlers);
  }

  function setWait(text) { $("waitStatus").textContent = text; }

  function alone() {
    if (S.pc) return;
    showShare();
    setWait(S.startedAt ? "They left. The link still works — waiting…" : "Waiting for someone to join…");
  }

  // Only one side makes the first offer. Perfect negotiation would sort out
  // both offering at once, but rolling back a first offer whose m-lines differ
  // from the other side's (video vs voice-only) trips a Chrome bug ("Failed to
  // start SCTP transport"), so avoid the collision in the first place.
  function peerPresent(cid, initiate) {
    if (!S.localStream) return;
    clearTimeout(S.leftTimer);
    S.peerAway = false;
    if (S.pc && S.peer === cid) return; // they reconnected to the server; ICE handles the media side
    if (S.pc) closePC();               // someone new after the previous person left
    S.peer = cid;
    setWait("Connecting…");
    clearTimeout(S.offerWait);
    if (initiate) createPC();
    // Their offer should arrive within a second; if it got lost, offer ourselves.
    else S.offerWait = setTimeout(() => { if (!S.pc && S.peer === cid && S.localStream) createPC(); }, 5000);
  }

  // The server lost the other person's socket. Media is peer-to-peer, so this
  // alone doesn't end the call: only if the media path is down too.
  function peerLeftSignalling(cid) {
    if (cid !== S.peer || !S.pc) return;
    S.peerAway = true;
    if (!iceUp()) armLeft();
  }
  // Signalling says they're gone and media is down too: give them a few
  // seconds to come back (a reload, a network switch), then stop waiting.
  function armLeft() {
    clearTimeout(S.leftTimer);
    S.leftTimer = setTimeout(() => { if (S.pc && !iceUp()) remoteGone("They left."); }, 8000);
  }

  function showShare() {
    const url = linkFor(S.code);
    $("linkText").textContent = url;
    $("shareBtn").hidden = !navigator.share;
    try {
      const qr = qrcode(0, "M"); qr.addData(url); qr.make();
      $("qr").innerHTML = qr.createSvgTag({ scalable: true, margin: 1 });
      $("qr").hidden = false;
    } catch { $("qr").hidden = true; }
    $("shareBox").hidden = false;
  }

  // ---------- peer connection (perfect negotiation) ----------
  // One RTCPeerConnection carries audio, video and a control data channel.
  // Either side can (re)negotiate at any time; offer collisions are resolved
  // by fixed polite/impolite roles (the "perfect negotiation" pattern), which
  // is what makes ICE restarts and track changes safe mid-call.
  function createPC() {
    const pc = new RTCPeerConnection({ iceServers: S.backend.iceServers, bundlePolicy: "max-bundle", rtcpMuxPolicy: "require" });
    S.pc = pc;
    S.sid = rand(10); S.remoteSid = null;
    S.polite = CID > S.peer;
    S.makingOffer = false; S.ignoreOffer = false; S.answerPending = false;
    S.chain = Promise.resolve();
    S.everUp = false; S.restarts = 0;
    S.remoteStream = new MediaStream();
    remoteCamOn = true;

    for (const t of S.localStream.getTracks()) pc.addTrack(t, S.localStream);
    preferRed(pc);

    const dc = pc.createDataChannel("ctl", { negotiated: true, id: 0 });
    S.dc = dc;
    dc.onopen = sendState;
    dc.onmessage = (e) => { if (S.dc === dc) onControl(e.data); };

    pc.onnegotiationneeded = async () => {
      if (S.pc !== pc) return;
      try {
        S.makingOffer = true;
        await pc.setLocalDescription();
        signal({ description: pc.localDescription });
      } catch (e) { console.warn("negotiation", e); }
      finally { S.makingOffer = false; }
    };
    pc.onicecandidate = (e) => { if (S.pc === pc && e.candidate) signal({ candidate: e.candidate }); };
    pc.ontrack = (e) => {
      if (S.pc !== pc) return;
      const t = e.track;
      S.remoteStream.addTrack(t);
      t.onmute = t.onunmute = () => updateRemoteView();
      t.onended = () => { if (S.pc === pc) { S.remoteStream.removeTrack(t); updateRemoteView(); } };
      if (t.kind === "audio") startMeter(S.remoteStream);
      enterStage();
      updateRemoteView();
    };
    pc.oniceconnectionstatechange = () => onIce(pc);
    pc.onconnectionstatechange = () => { if (S.pc === pc && pc.connectionState === "failed") onIce(pc); };
    armGiveUp();
  }

  function signal(obj) {
    if (S.sig) S.sig.send({ ...JSON.parse(JSON.stringify(obj)), sid: S.sid, to: S.remoteSid });
  }

  function onSignal(cid, data) {
    if (!S.localStream || !data) return;
    // Only a fresh offer may start a connection; anything else is a straggler
    // from a connection we already closed (e.g. the signalling copy of a "bye"
    // that arrived over the data channel first).
    const fresh = data.description && data.description.type === "offer" && !data.to;
    if (cid !== S.peer) {
      if (S.pc || !fresh) return;
      S.peer = cid;
    }
    if (!S.pc) {
      if (!fresh) return;
      clearTimeout(S.offerWait); clearTimeout(S.leftTimer);
      setWait("Connecting…");
      createPC();
    }
    S.chain = S.chain.then(() => applySignal(data)).catch((e) => console.warn("signal", e));
  }

  async function applySignal(data) {
    let pc = S.pc;
    if (!pc || !data.sid) return;
    // Messages carry the sender's connection id (sid) and which of our
    // connections they're meant for (to). This keeps a reload on either side
    // from mixing up two generations of the connection.
    if (data.to && data.to !== S.sid) return; // for a connection we've since replaced
    if (data.bye) { remoteGone("They hung up."); return; }
    if (S.remoteSid && data.sid !== S.remoteSid) {
      // A brand-new connection from them (they reloaded): start fresh too.
      if (data.to || !data.description || data.description.type !== "offer") return;
      const peer = S.peer;
      closePC(); S.peer = peer; createPC(); pc = S.pc;
    }
    S.remoteSid = data.sid;
    const { description, candidate } = data;
    if (description) {
      const readyForOffer = !S.makingOffer && (pc.signalingState === "stable" || S.answerPending);
      const collision = description.type === "offer" && !readyForOffer;
      S.ignoreOffer = !S.polite && collision;
      if (S.ignoreOffer) return;
      S.answerPending = description.type === "answer";
      await pc.setRemoteDescription(description);
      S.answerPending = false;
      if (description.type === "offer") {
        await pc.setLocalDescription();
        signal({ description: pc.localDescription });
      }
    } else if (candidate) {
      try { await pc.addIceCandidate(candidate); }
      catch (e) { if (!S.ignoreOffer) console.warn("candidate", e); }
    }
  }

  // Opus + RED (RFC 2198): each packet also carries the previous frame, so a
  // single lost packet costs nothing audible. Chrome only uses it when RED is
  // the preferred codec.
  function preferRed(pc) {
    try {
      const caps = RTCRtpReceiver.getCapabilities && RTCRtpReceiver.getCapabilities("audio");
      if (!caps) return;
      const isRed = (c) => c.mimeType.toLowerCase() === "audio/red";
      const red = caps.codecs.filter(isRed);
      if (!red.length) return;
      const codecs = [...red, ...caps.codecs.filter((c) => !isRed(c))];
      for (const t of pc.getTransceivers()) {
        if (t.sender.track && t.sender.track.kind === "audio" && t.setCodecPreferences) t.setCodecPreferences(codecs);
      }
    } catch (e) { console.warn("RED", e); }
  }

  // Voice matters more than video: give audio packets priority locally and
  // mark them for priority on networks that honour DSCP.
  async function tuneSenders(pc) {
    if (pc._tuned) return;
    pc._tuned = true;
    for (const s of pc.getSenders()) {
      if (!s.track || s.track.kind !== "audio") continue;
      try {
        const p = s.getParameters();
        if (!p.encodings || !p.encodings.length) continue;
        p.encodings[0].priority = "high";
        p.encodings[0].networkPriority = "high";
        await s.setParameters(p);
      } catch {}
    }
  }

  function iceUp(pc = S.pc) {
    const s = pc && pc.iceConnectionState;
    return s === "connected" || s === "completed";
  }

  function onIce(pc) {
    if (S.pc !== pc) return;
    const st = pc.iceConnectionState;
    clearTimeout(S.restartTimer);
    if (st === "connected" || st === "completed") {
      S.restarts = 0;
      clearTimeout(S.giveUpTimer); S.giveUpTimer = 0;
      clearTimeout(S.leftTimer);
      setNet(null);
      if (!S.everUp) { S.everUp = true; startTimer(); }
      tuneSenders(pc);
    } else if (st === "disconnected") {
      // Often a blip that recovers by itself; restart ICE if it doesn't soon.
      setNet(S.everUp ? "Reconnecting…" : "Connecting…");
      // Staggered so both sides rarely restart at the same moment.
      S.restartTimer = setTimeout(() => restartIce("disconnected"), S.polite ? 4000 : 2000);
      armGiveUp();
      if (S.peerAway) armLeft();
    } else if (st === "failed" || pc.connectionState === "failed") {
      setNet(S.everUp ? "Reconnecting…" : "Connecting…");
      restartIce("failed");
      armGiveUp();
      if (S.peerAway) armLeft();
    } else if (st === "checking" && !S.everUp) {
      setNet("Connecting…");
    }
  }

  function restartIce(why) {
    const pc = S.pc;
    if (!pc || pc.signalingState === "closed" || S.restarts > 10) return;
    S.restarts++;
    console.info("ICE restart:", why);
    if (S.sig) S.sig.reconnectNow();
    pc.restartIce();
  }

  function armGiveUp() {
    if (S.giveUpTimer) return;
    const first = !S.everUp;
    S.giveUpTimer = setTimeout(() => {
      S.giveUpTimer = 0;
      if (!S.pc || iceUp()) return;
      if (first) endCall("Couldn't connect. A firewall or network may be blocking the call.", true);
      else remoteGone("The connection was lost.");
    }, first ? 30000 : 45000);
  }

  // Switching Wi-Fi <-> mobile data changes our address. Restarting ICE right
  // away finds the new path in a second or two instead of waiting ~30 s for
  // the old one to time out.
  function networkChanged(why) {
    if (S.sig) S.sig.reconnectNow();
    if (S.pc && S.everUp) setTimeout(() => restartIce(why), 300);
  }
  addEventListener("online", () => networkChanged("online"));
  try { navigator.connection && navigator.connection.addEventListener("change", () => networkChanged("network change")); } catch {}

  function closePC() {
    const pc = S.pc, dc = S.dc;
    S.pc = null; S.dc = null; S.peer = null; S.remoteSid = null; S.peerAway = false;
    clearTimeout(S.restartTimer); clearTimeout(S.giveUpTimer); clearTimeout(S.leftTimer); clearTimeout(S.offerWait);
    S.giveUpTimer = 0;
    try { dc && dc.close(); } catch {}
    try { pc && pc.close(); } catch {}
    $("remoteVideo").srcObject = null;
    S.remoteStream = null;
    $("remoteMuted").hidden = true;
    $("playBtn").hidden = true;
    setNet(null);
    stopTimer(); stopStats(); stopMeter();
    S.inStage = false;
  }

  function sayBye() {
    const dc = S.dc;
    if (dc && dc.readyState === "open") try { dc.send(JSON.stringify({ t: "bye" })); } catch {}
    if (S.pc) signal({ bye: true });
  }

  // The other person is gone. Whoever is left keeps the room open and goes
  // back to waiting, so the same link can be used to call back.
  function remoteGone(reason) {
    if (!S.localStream || !S.pc) return;
    closePC();
    if (S.sig) S.sig.peerGone();
    toast(reason);
    $("preview").hidden = !hasVideo(S.localStream);
    $("previewVideo").srcObject = S.localStream;
    showShare();
    setWait("They left. The link still works — waiting…");
    show("waitScreen");
  }

  function endCall(reason, isError, fullCall) {
    const duration = S.startedAt ? Date.now() - S.startedAt : 0;
    sayBye();
    closePC();
    if (S.sig) { const sig = S.sig; S.sig = null; setTimeout(() => sig.close(), 150); }
    if (S.localStream) S.localStream.getTracks().forEach((t) => t.stop());
    S.localStream = null;
    $("previewVideo").srcObject = null;
    $("localVideo").srcObject = null;
    releaseWakeLock();
    S.startedAt = 0;

    $("endTitle").textContent = fullCall ? "Call is full" : isError ? "Couldn't connect" : "Call ended";
    const parts = [];
    if (reason) parts.push(reason);
    if (duration > 1000) parts.push("Duration " + fmt(duration) + ".");
    $("endSub").textContent = parts.join(" ");
    $("rejoinBtn").textContent = isError ? "Try again" : "Rejoin";
    show("endScreen");
  }

  // ---------- control channel ----------
  function onControl(raw) {
    let m; try { m = JSON.parse(raw); } catch { return; }
    if (m.t === "state") {
      $("remoteMuted").hidden = m.mic !== false;
      remoteCamOn = m.cam !== false;
      updateRemoteView();
    } else if (m.t === "bye") {
      remoteGone("They hung up.");
    }
  }
  function sendState() {
    const dc = S.dc;
    if (dc && dc.readyState === "open") try { dc.send(JSON.stringify({ t: "state", mic: S.micOn, cam: S.camOn })); } catch {}
  }

  // ---------- in call ----------
  function setNet(text) {
    $("netBadge").textContent = text || "";
    $("netBadge").hidden = !text;
  }

  function enterStage() {
    const rv = $("remoteVideo");
    if (rv.srcObject !== S.remoteStream) rv.srcObject = S.remoteStream;
    rv.play().then(() => ($("playBtn").hidden = true)).catch(() => {
      // Autoplay with sound was blocked (e.g. iOS after the tab sat idle).
      $("playBtn").hidden = false;
      const go = () => rv.play().then(() => ($("playBtn").hidden = true)).catch(() => {});
      addEventListener("pointerdown", go, { once: true });
    });
    if (S.inStage) return;
    S.inStage = true;
    $("localVideo").srcObject = S.localStream;
    $("previewVideo").srcObject = null;
    const ownVideo = hasVideo(S.localStream);
    $("localWrap").hidden = !ownVideo;
    $("camBtn").hidden = !ownVideo;
    updateControls();
    rv.onresize = fitRemote;
    if (!iceUp()) setNet("Connecting…");
    show("stage");
    startStats();
    poke();
    checkFlip();
  }

  function updateRemoteView() {
    const remote = S.remoteStream;
    if (!remote) return;
    const vt = remote.getVideoTracks().find((t) => t.readyState === "live");
    const sending = !!vt && !vt.muted;
    const vid = sending && remoteCamOn;
    $("remoteVideo").style.visibility = vid ? "visible" : "hidden";
    $("avatar").hidden = vid;
    $("avatarLabel").textContent = sending ? "Camera off" : "Voice call";
    fitRemote();
  }
  // Fill the screen when orientations match; letterbox when they don't, so a
  // portrait phone doesn't crop a landscape laptop feed down to a sliver.
  function fitRemote() {
    const v = $("remoteVideo");
    if (!v.videoWidth) return;
    const remotePortrait = v.videoHeight > v.videoWidth;
    const screenPortrait = innerHeight > innerWidth;
    $("stage").classList.toggle("contain", remotePortrait !== screenPortrait);
  }
  addEventListener("resize", fitRemote);

  function updateControls() {
    $("micBtn").classList.toggle("off", !S.micOn);
    $("micBtn").innerHTML = `<svg><use href="#i-${S.micOn ? "mic" : "mic-off"}"/></svg>`;
    $("micBtn").setAttribute("aria-label", S.micOn ? "Mute" : "Unmute");
    $("camBtn").classList.toggle("off", !S.camOn);
    $("camBtn").innerHTML = `<svg><use href="#i-${S.camOn ? "video" : "video-off"}"/></svg>`;
    $("camBtn").setAttribute("aria-label", S.camOn ? "Camera off" : "Camera on");
    $("localOff").hidden = S.camOn;
  }

  $("micBtn").onclick = () => {
    S.micOn = !S.micOn;
    S.localStream.getAudioTracks().forEach((t) => (t.enabled = S.micOn));
    updateControls(); sendState(); poke();
  };
  $("camBtn").onclick = () => {
    S.camOn = !S.camOn;
    S.localStream.getVideoTracks().forEach((t) => (t.enabled = S.camOn));
    updateControls(); sendState(); poke();
  };

  async function checkFlip() {
    let cams = 0;
    try { cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput").length; } catch {}
    $("flipBtn").hidden = !(cams > 1 && hasVideo(S.localStream));
  }
  $("flipBtn").onclick = async () => {
    poke();
    const ok = await reacquire("video", S.facing === "user" ? "environment" : "user");
    if (!ok) toast("Couldn't switch camera");
  };

  $("hangBtn").onclick = () => endCall("", false);

  // ---------- timer / stats / meter / idle ----------
  function fmt(ms) {
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0");
  }
  function startTimer() {
    if (!S.startedAt) S.startedAt = Date.now();
    stopTimer();
    const tick = () => ($("timer").textContent = fmt(Date.now() - S.startedAt));
    tick(); S.timerId = setInterval(tick, 1000);
  }
  function stopTimer() { clearInterval(S.timerId); }

  // Once a second: connection quality bars, plus the info panel if open.
  let lastStats = null, infoOpen = false;
  function startStats() { stopStats(); S.statsTimer = setInterval(pollStats, 1000); pollStats(); }
  function stopStats() { clearInterval(S.statsTimer); S.statsTimer = 0; lastStats = null; $("bars").hidden = true; }

  async function pollStats() {
    const pc = S.pc;
    if (!pc) return;
    let st;
    try { st = await pc.getStats(); } catch { return; }
    const by = {}; st.forEach((r) => (by[r.id] = r));
    const now = {}; let pair = null;
    st.forEach((r) => {
      // There can be several streams of a kind (e.g. inactive ones after a renegotiation); use the busiest.
      if ((r.type === "inbound-rtp" || r.type === "outbound-rtp") && r.kind) {
        const k = r.type + r.kind, bytes = (x) => x.bytesReceived || x.bytesSent || 0;
        if (!now[k] || bytes(r) > bytes(now[k])) now[k] = r;
      }
      if (r.type === "transport" && r.selectedCandidatePairId) pair = by[r.selectedCandidatePairId];
    });
    if (!pair) st.forEach((r) => { if (r.type === "candidate-pair" && (r.selected || r.nominated) && r.state === "succeeded") pair = r; });
    const prev = lastStats || {};
    const delta = (k, f) => (now[k] && prev[k] ? now[k][f] - prev[k][f] : 0);
    const dt = now["inbound-rtpaudio"] && prev["inbound-rtpaudio"] ? (now["inbound-rtpaudio"].timestamp - prev["inbound-rtpaudio"].timestamp) / 1000 : 0;
    const kbps = (k, f) => {
      const a = now[k], b = prev[k];
      if (!a || !b) return null;
      const t = (a.timestamp - b.timestamp) / 1000;
      return t > 0 ? Math.round(((a[f] - b[f]) * 8) / t / 1000) : null;
    };
    const lost = delta("inbound-rtpaudio", "packetsLost"), got = delta("inbound-rtpaudio", "packetsReceived");
    const loss = got + lost > 0 ? (100 * lost) / (got + lost) : 0;
    const rtt = pair && pair.currentRoundTripTime != null ? pair.currentRoundTripTime * 1000 : null;
    lastStats = now;

    // Quality: 3 bars good, 2 ok, 1 poor (thresholds roughly where calls start to feel laggy / choppy).
    let q = 3;
    if ((rtt != null && rtt > 300) || loss > 3) q = 2;
    if ((rtt != null && rtt > 700) || loss > 10 || (dt && got === 0)) q = 1;
    const bars = $("bars");
    bars.hidden = !iceUp(pc);
    bars.dataset.q = q;
    bars.title = ["", "Poor connection", "OK connection", "Good connection"][q];

    if (!infoOpen) return;
    let route = "none yet";
    if (pair) {
      const l = by[pair.localCandidateId] || {}, r = by[pair.remoteCandidateId] || {};
      const kind = (c) => ({ host: "local network", srflx: "internet (STUN)", prflx: "internet", relay: "TURN relay" }[c.candidateType] || c.candidateType);
      route = (l.candidateType === "relay" || r.candidateType === "relay" ? "relayed" : "direct") +
        "\n  you: " + kind(l) + " " + (l.relayProtocol || l.protocol || "") + "\n  them: " + kind(r);
    }
    const codec = (k) => { const s = now[k]; const c = s && by[s.codecId]; return c ? c.mimeType.split("/")[1] : "–"; };
    const iv = now["inbound-rtpvideo"];
    const v = $("remoteVideo");
    const f = (x) => (x == null ? "–" : x + " kbps");
    $("info").textContent = [
      "server:  " + (S.backend ? (S.backend.kind === "worker" ? "worker" : "public PeerJS") + (S.backend.turn ? " + TURN" : ", no TURN") : "–"),
      "ice:     " + pc.iceConnectionState + " / " + pc.connectionState + (S.restarts ? " (restarts " + S.restarts + ")" : ""),
      "route:   " + route,
      "rtt:     " + (rtt == null ? "–" : Math.round(rtt) + " ms") + "   audio loss: " + loss.toFixed(1) + "%",
      "recv:    audio " + f(kbps("inbound-rtpaudio", "bytesReceived")) + " (" + codec("inbound-rtpaudio") + "), video " + f(kbps("inbound-rtpvideo", "bytesReceived")) +
        (iv && iv.frameWidth ? " " + iv.frameWidth + "×" + iv.frameHeight + " " + Math.round(iv.framesPerSecond || 0) + "fps" : ""),
      "send:    audio " + f(kbps("outbound-rtpaudio", "bytesSent")) + ", video " + f(kbps("outbound-rtpvideo", "bytesSent")) +
        (pair && pair.availableOutgoingBitrate ? "  (est. " + Math.round(pair.availableOutgoingBitrate / 1000) + " kbps available)" : ""),
      "player:  " + (v.paused ? "PAUSED" : "playing") + (v.videoWidth ? ", " + v.videoWidth + "×" + v.videoHeight : ""),
    ].join("\n");
  }
  $("timer").addEventListener("click", (e) => {
    e.stopPropagation();
    infoOpen = !infoOpen;
    $("info").hidden = !infoOpen;
    if (infoOpen) { $("info").textContent = "…"; pollStats(); }
  });

  // Speaking ring around the avatar when there's no video to look at.
  function startMeter(remote) {
    stopMeter();
    if (!remote.getAudioTracks().length) return;
    try {
      S.audioCtx = S.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      S.audioCtx.resume().catch(() => {});
      const src = S.audioCtx.createMediaStreamSource(remote);
      const an = S.audioCtx.createAnalyser(); an.fftSize = 512;
      src.connect(an); // analyser only; playback goes through the <video> element
      const buf = new Uint8Array(an.fftSize);
      let lvl = 0;
      const ring = $("ring");
      const loop = () => {
        an.getByteTimeDomainData(buf);
        let sum = 0; for (const v of buf) { const d = (v - 128) / 128; sum += d * d; }
        lvl = Math.max(Math.min(1, Math.sqrt(sum / buf.length) * 6), lvl * 0.85);
        ring.style.setProperty("--lvl", lvl.toFixed(3));
        S.meterRaf = requestAnimationFrame(loop);
      };
      S.meterSrc = src;
      loop();
    } catch {}
  }
  function stopMeter() {
    cancelAnimationFrame(S.meterRaf);
    try { S.meterSrc && S.meterSrc.disconnect(); } catch {}
    S.meterSrc = null;
  }

  // Fade the controls out after a few seconds of no interaction (video only).
  let idleTimer;
  function poke() {
    $("stage").classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (S.inStage && $("avatar").hidden && !infoOpen) $("stage").classList.add("idle");
    }, 4000);
  }
  $("stage").addEventListener("pointerdown", (e) => { if (e.target.closest("#localWrap")) return; poke(); });

  // Draggable self-view that snaps to the nearest corner.
  (() => {
    const w = $("localWrap");
    let sx, sy, ox, oy, dragging = false;
    w.addEventListener("pointerdown", (e) => {
      dragging = true; w.setPointerCapture(e.pointerId);
      const r = w.getBoundingClientRect();
      sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
      w.style.transition = "none";
    });
    w.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      w.style.left = ox + e.clientX - sx + "px"; w.style.top = oy + e.clientY - sy + "px";
      w.style.right = "auto"; w.style.bottom = "auto";
    });
    const end = () => {
      if (!dragging) return; dragging = false;
      const r = w.getBoundingClientRect(), m = 14;
      const left = r.left + r.width / 2 < innerWidth / 2;
      const top = r.top + r.height / 2 < innerHeight / 2;
      w.style.transition = "left 160ms ease, top 160ms ease";
      w.style.left = (left ? m : innerWidth - r.width - m) + "px";
      w.style.top = (top ? m + 20 : innerHeight - r.height - m - 110) + "px";
    };
    w.addEventListener("pointerup", end); w.addEventListener("pointercancel", end);
  })();

  // ---------- wake lock / lifecycle ----------
  async function requestWakeLock() {
    try { if ("wakeLock" in navigator) S.wakeLock = await navigator.wakeLock.request("screen"); } catch {}
  }
  function releaseWakeLock() { try { S.wakeLock && S.wakeLock.release(); } catch {} S.wakeLock = null; }

  // Coming back to the tab: re-take the wake lock, revive the signalling
  // socket, replace capture tracks iOS killed in the background, and kick ICE
  // if the connection died meanwhile.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !S.localStream) return;
    requestWakeLock();
    if (S.sig) S.sig.reconnectNow();
    for (const t of S.localStream.getTracks()) if (t.readyState === "ended") reacquire(t.kind);
    if (S.pc && S.everUp && !iceUp()) restartIce("visible again");
  });

  addEventListener("pagehide", () => {
    sayBye();
    if (S.sig) S.sig.close();
  });

  // ---------- share / buttons ----------
  $("shareBtn").onclick = async () => {
    try { await navigator.share({ title: "Join my call", url: linkFor(S.code) }); } catch {}
  };
  $("copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(linkFor(S.code)); toast("Link copied"); }
    catch {
      const r = document.createRange(); r.selectNodeContents($("linkText"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast("Press copy to copy the link");
    }
  };
  $("cancelBtn").onclick = () => { endCall("", false); route(true); };

  document.querySelectorAll("[data-start]").forEach((b) => (b.onclick = () => begin(b.dataset.start, rand(10))));
  document.querySelectorAll("[data-join]").forEach((b) => (b.onclick = () => begin(b.dataset.join, codeFromHash())));
  $("newCallBtn").onclick = () => route(true);
  $("endNewBtn").onclick = () => route(true);
  $("rejoinBtn").onclick = () => route();

  function route(clear) {
    if (clear) history.replaceState(null, "", location.pathname + location.search);
    show(codeFromHash() ? "joinScreen" : "startScreen");
  }
  addEventListener("hashchange", () => { if (!S.localStream) route(); });

  if (!window.RTCPeerConnection) {
    $("startErr").textContent = "This browser doesn't support WebRTC calls.";
    $("startErr").hidden = false;
  }
  discover().catch(() => {});
  route();
})();
</script>
</body>
</html>
