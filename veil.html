<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<meta name="description" content="A text editor that ciphers every character as you type — you never see your own plaintext." />
<title>Veil</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --ink: #e9edf5;
    --muted: #8993a7;
    --accent: #a78bfa;
    --warn: #f0a35e;
    --line: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100svh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color: transparent;
  }
  #pad {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    margin: 0;
    padding: 20px clamp(14px, 4vw, 28px);
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--ink);
    caret-color: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 16px;
    line-height: 1.65;
    letter-spacing: 0.01em;
    word-break: break-word;
  }
  #pad::placeholder { color: rgba(137, 147, 167, 0.55); }
  #pad.revealed {
    color: var(--warn);
    background: rgba(240, 163, 94, 0.05);
  }

  .bar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px clamp(10px, 3vw, 20px);
    border-top: 1px solid var(--line);
    background: var(--panel);
    user-select: none;
    -webkit-user-select: none;
  }
  .brand {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 4px;
  }
  .spacer { flex: 1 1 auto; }
  .count {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    padding: 0 4px;
  }
  button {
    appearance: none;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 12px;
    cursor: pointer;
    touch-action: manipulation;
    transition: color 120ms ease, background 120ms ease, border-color 120ms ease, transform 80ms ease;
  }
  button:hover { color: var(--ink); }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[disabled] { opacity: 0.4; cursor: default; }
  .modes, .actions { display: flex; align-items: center; gap: 6px; }
  .chip[aria-pressed="true"] {
    color: #14101f;
    background: var(--accent);
    border-color: transparent;
  }
  #reveal[aria-pressed="true"] {
    color: #1c1206;
    background: var(--warn);
    border-color: transparent;
  }
  #clear.arm { color: var(--warn); border-color: var(--warn); }

  @media (max-width: 520px) {
    /* Two deliberate rows instead of a ragged wrap: ciphers, then actions. */
    .bar { gap: 8px 6px; padding-left: 12px; padding-right: 12px; }
    .brand { flex: 1 1 auto; }
    .spacer { display: none; }
    .actions { flex: 1 1 100%; justify-content: flex-end; }
    .actions .count { margin-right: auto; }
    button { padding: 8px 12px; }
  }

  @media (max-width: 380px) {
    .brand { display: none; }   /* four chips need the whole row */
  }
</style>
</head>
<body>
  <textarea id="pad"
    placeholder="start typing — it ciphers as you go"
    spellcheck="false"
    autocomplete="off"
    autocapitalize="off"
    autocorrect="off"
    aria-label="Ciphered text"></textarea>

  <footer class="bar">
    <span class="brand">veil</span>
    <div class="modes" role="group" aria-label="Cipher">
      <button class="chip" type="button" data-mode="rot13" aria-pressed="true">rot13</button>
      <button class="chip" type="button" data-mode="atbash" aria-pressed="false">atbash</button>
      <button class="chip" type="button" data-mode="rot47" aria-pressed="false">rot47</button>
      <button class="chip" type="button" data-mode="shuffle" aria-pressed="false" title="A fresh random alphabet on every keystroke">shuffle</button>
    </div>
    <span class="spacer"></span>
    <div class="actions">
      <span class="count" id="count">0</span>
      <button id="reveal" type="button" aria-pressed="false" title="Show the plaintext (read-only)">reveal</button>
      <button id="copy" type="button" title="Copy what's on screen">copy</button>
      <button id="clear" type="button" title="Erase everything">clear</button>
    </div>
  </footer>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------
  // Ciphers. Every one must be an involution (cipher(cipher(x)) === x) and
  // map one character to exactly one character. That is what lets the
  // textarea hold nothing but ciphertext: encoding and decoding are the
  // same call, offsets never shift, so the caret, selection, scroll
  // position and the browser's own undo stack all stay valid.
  // ---------------------------------------------------------------------
  const rot = (c, base, span, by) => String.fromCharCode(base + ((c - base + by) % span));

  // Shuffle mode's alphabet: a random *involution* — every letter paired
  // with exactly one other — re-rolled on each keystroke. Pairing rather
  // than an arbitrary permutation is what keeps decode === encode, so
  // shuffle behaves like the fixed ciphers everywhere else in the file.
  const LETTERS = 'abcdefghijklmnopqrstuvwxyz';
  const DIGITS = '0123456789';

  const rand = (n) => {
    try { return crypto.getRandomValues(new Uint32Array(1))[0] % n; }
    catch (_) { return Math.floor(Math.random() * n); }
  };

  function randomPairing() {
    const pair = (chars) => {                 // both alphabets are even-sized
      const a = [...chars];
      for (let i = a.length - 1; i > 0; i--) {
        const j = rand(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      const out = {};
      for (let i = 0; i < a.length; i += 2) {
        out[a[i]] = a[i + 1];
        out[a[i + 1]] = a[i];
      }
      return out;
    };
    return { ...pair(LETTERS), ...pair(DIGITS) };
  }

  let key = randomPairing();

  const keyToString = () => [...LETTERS + DIGITS].map((c) => key[c]).join('');

  function keyFromString(str) {
    const src = LETTERS + DIGITS;
    if (typeof str !== 'string' || str.length !== src.length) return null;
    const k = {};
    for (let i = 0; i < src.length; i++) {
      if (!src.includes(str[i])) return null;
      k[src[i]] = str[i];
    }
    for (const c of src) if (k[k[c]] !== c) return null;   // must be an involution
    return k;
  }

  const CIPHERS = {
    rot13: (s) => s.replace(/[a-zA-Z0-9]/g, (ch) => {
      const c = ch.charCodeAt(0);
      if (c >= 97) return rot(c, 97, 26, 13);       // a-z
      if (c >= 65) return rot(c, 65, 26, 13);       // A-Z
      return rot(c, 48, 10, 5);                     // 0-9
    }),
    atbash: (s) => s.replace(/[a-zA-Z0-9]/g, (ch) => {
      const c = ch.charCodeAt(0);
      if (c >= 97) return String.fromCharCode(219 - c);  // a<->z
      if (c >= 65) return String.fromCharCode(155 - c);  // A<->Z
      return String.fromCharCode(105 - c);               // 0<->9
    }),
    // ROT47 over printable ASCII, so punctuation is scrambled too. Space
    // and newline are outside the range and pass through untouched.
    rot47: (s) => s.replace(/[!-~]/g, (ch) => rot(ch.charCodeAt(0), 33, 94, 47)),
    // Keyed by whatever `key` holds right now — see reshuffle().
    shuffle: (s) => s.replace(/[a-zA-Z0-9]/g, (ch) => {
      const low = ch.toLowerCase();
      const to = key[low];
      return ch === low ? to : to.toUpperCase();
    }),
  };

  const STORE = 'veil.v1';
  const pad = document.getElementById('pad');
  const countEl = document.getElementById('count');
  const revealBtn = document.getElementById('reveal');
  const copyBtn = document.getElementById('copy');
  const clearBtn = document.getElementById('clear');
  const chips = [...document.querySelectorAll('.chip')];

  let mode = 'rot13';
  let revealed = false;
  let composing = false;

  const code = (s) => CIPHERS[mode](s);

  // --- persistence ------------------------------------------------------
  // Only ever stores the ciphertext. These are toy ciphers, so treat this
  // as obfuscation, not security.
  function save() {
    if (revealed || composing) return;
    try {
      localStorage.setItem(STORE, JSON.stringify({ mode, text: pad.value, key: keyToString() }));
    } catch (_) { /* private mode, quota — nothing to do */ }
  }

  function restore() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (_) {}
    if (saved && typeof saved.text === 'string') pad.value = saved.text;
    if (saved && CIPHERS[saved.mode]) mode = saved.mode;
    const savedKey = saved && keyFromString(saved.key);   // shuffle is unreadable without it
    if (savedKey) key = savedKey;
    chips.forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.mode === mode)));
    updateCount();
  }

  function updateCount() {
    countEl.textContent = String(pad.value.length);
  }

  // --- input: cipher every character on its way in ----------------------
  function insertCiphered(text) {
    if (!text) return;
    let ok = false;
    try {
      ok = document.execCommand('insertText', false, text);  // keeps native undo
    } catch (_) { ok = false; }
    if (!ok) {
      pad.setRangeText(text, pad.selectionStart, pad.selectionEnd, 'end');
      pad.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }

  // In shuffle mode the alphabet is re-rolled after every edit, so the whole
  // document churns on each keystroke. Nothing changes length, so the caret,
  // selection and scroll position survive the rewrite.
  function reshuffle() {
    const { selectionStart: s, selectionEnd: e, scrollTop } = pad;
    const plain = code(pad.value);        // decode with the outgoing alphabet
    key = randomPairing();
    pad.value = code(plain);              // re-encode with the new one
    pad.setSelectionRange(s, e);
    pad.scrollTop = scrollTop;
  }

  // Native undo cannot survive that: the browser's saved states are ciphertext
  // under alphabets that no longer exist, so they'd decode to nonsense. In
  // shuffle mode only, keep our own stack of plaintext snapshots instead.
  const undoStack = [];
  const redoStack = [];
  const HISTORY_LIMIT = 200;

  function snapshot() {
    const plain = code(pad.value);
    if (undoStack[undoStack.length - 1] === plain) return;
    undoStack.push(plain);
    if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack.length = 0;
  }

  function step(from, to) {
    if (!from.length) return;
    to.push(code(pad.value));
    const plain = from.pop();
    const caret = Math.min(pad.selectionStart, plain.length);
    key = randomPairing();
    pad.value = code(plain);
    pad.setSelectionRange(caret, caret);
    updateCount();
    save();
  }

  function resetHistory() {
    undoStack.length = 0;
    redoStack.length = 0;
  }

  pad.addEventListener('keydown', (e) => {
    if (mode !== 'shuffle' || revealed) return;
    if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
    const k = e.key.toLowerCase();
    const undo = k === 'z' && !e.shiftKey;
    const redo = k === 'y' || (k === 'z' && e.shiftKey);
    if (!undo && !redo) return;
    e.preventDefault();
    step(undo ? undoStack : redoStack, undo ? redoStack : undoStack);
  });

  pad.addEventListener('beforeinput', (e) => {
    if (composing || revealed) return;
    const t = e.inputType;
    if (t === 'historyUndo' || t === 'historyRedo') {
      if (mode !== 'shuffle') return;      // native undo is correct elsewhere
      e.preventDefault();                  // backstop for Edit-menu undo
      const undo = t === 'historyUndo';
      step(undo ? undoStack : redoStack, undo ? redoStack : undoStack);
      return;
    }
    if (mode === 'shuffle') snapshot();
    let data = null;
    if (t === 'insertText' || t === 'insertReplacementText') {
      data = e.data;
      if (data == null && e.dataTransfer) data = e.dataTransfer.getData('text/plain');
    } else if (t === 'insertFromPaste' || t === 'insertFromPasteAsQuotation' || t === 'insertFromDrop') {
      data = e.dataTransfer ? e.dataTransfer.getData('text/plain') : e.data;
    }
    // Deletions, line breaks and undo/redo need no help: they move
    // ciphertext around, and '\n' ciphers to itself.
    if (data == null || data === '') return;
    e.preventDefault();
    insertCiphered(code(data));
  });

  // Paste has its own event in every browser; beforeinput's dataTransfer is
  // less reliable, so intercept here first.
  pad.addEventListener('paste', (e) => {
    if (revealed) return;
    const text = (e.clipboardData || window.clipboardData)?.getData('text');
    if (text == null) return;
    e.preventDefault();
    insertCiphered(code(text));
  });

  // IME / predictive keyboards compose in place; leave the composition
  // alone and cipher the result once it lands.
  pad.addEventListener('compositionstart', () => {
    composing = true;
    if (mode === 'shuffle') snapshot();
  });
  pad.addEventListener('compositionend', (e) => {
    const data = e.data || '';
    // Stay `composing` until the browser's own input event has been and
    // gone, so nothing treats the raw composed text as ciphertext.
    setTimeout(() => {
      const end = pad.selectionStart;
      const start = end - data.length;
      if (data && start >= 0 && pad.value.slice(start, end) === data) {
        pad.setRangeText(code(data), start, end, 'end');
      }
      composing = false;
      if (mode === 'shuffle') reshuffle();
      updateCount();
      save();
    }, 0);
  });

  pad.addEventListener('input', () => {
    if (mode === 'shuffle' && !composing && !revealed) reshuffle();
    updateCount();
    save();
  });

  // --- reveal -----------------------------------------------------------
  function setReveal(on) {
    if (on === revealed) return;
    const { selectionStart: s, selectionEnd: e, scrollTop } = pad;
    revealed = on;
    pad.value = code(pad.value);          // involution: same call both ways
    pad.readOnly = on;
    pad.classList.toggle('revealed', on);
    pad.setSelectionRange(s, e);
    pad.scrollTop = scrollTop;
    revealBtn.setAttribute('aria-pressed', String(on));
    revealBtn.textContent = on ? 'hide' : 'reveal';
    chips.forEach((c) => { c.disabled = on; });
  }

  revealBtn.addEventListener('click', () => setReveal(!revealed));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && revealed) { setReveal(false); pad.focus(); }
  });

  // --- mode -------------------------------------------------------------
  chips.forEach((chip) => chip.addEventListener('click', () => {
    const next = chip.dataset.mode;
    if (next === mode || revealed) return;
    const plain = code(pad.value);        // decode with the outgoing cipher
    mode = next;
    if (mode === 'shuffle') key = randomPairing();
    pad.value = code(plain);              // re-encode with the new one
    resetHistory();
    chips.forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.mode === mode)));
    save();
    pad.focus();
  }));

  // --- copy / clear -----------------------------------------------------
  const timers = new WeakMap();
  function say(btn, text, ms) {
    const original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = text;
    clearTimeout(timers.get(btn));
    timers.set(btn, setTimeout(() => { btn.textContent = original; }, ms));
  }

  // Copies exactly what's on screen: ciphertext normally, plaintext while
  // revealed.
  copyBtn.addEventListener('click', async () => {
    const text = pad.value;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
    } catch (_) {
      pad.select();
      try { document.execCommand('copy'); } catch (__) { say(copyBtn, 'failed', 1400); return; }
      pad.setSelectionRange(text.length, text.length);
    }
    say(copyBtn, 'copied', 1200);
  });

  let armed = false;
  clearBtn.addEventListener('click', () => {
    if (!armed) {
      if (!pad.value) return;
      armed = true;
      clearBtn.classList.add('arm');
      say(clearBtn, 'sure?', 2600);
      setTimeout(() => { armed = false; clearBtn.classList.remove('arm'); }, 2600);
      return;
    }
    armed = false;
    clearBtn.classList.remove('arm');
    clearTimeout(timers.get(clearBtn));
    clearBtn.textContent = clearBtn.dataset.label || 'clear';
    setReveal(false);
    pad.value = '';
    resetHistory();
    updateCount();
    save();
    pad.focus();
  });

  restore();
  pad.focus();
})();
</script>
</body>
</html>
